<!-- @dsCard group="Components" viewport="700x300" name="NyVersjon" subtitle="A new version is ready: Oppdater or Senere, announced politely" -->
<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyVersjon</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../dist/sussi.global.js"></script>
<style>body{padding:20px 24px;background:var(--bg)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;max-width:760px}.lbl{margin:0 0 6px;font:var(--type-meta);color:var(--fg-3)}.s-toast{width:auto}</style>
</head><body><div id="root"></div>
<script>
// ?theme=dark. Plain React.createElement, so the card needs no Babel. stack: false, so the toasts sit in the
// grid instead of bottom right; each is then role="status" on its own.
const { NyVersjon } = window.SussiDesignSystem_a2c9b8;
const h = React.createElement;
if (new URLSearchParams(location.search).get('theme')) document.documentElement.dataset.theme = 'dark';
const none = () => {};
function App() {
  return h('div', { className: 'grid' },
    h('div', null, h('p', { className: 'lbl' }, 'Standard'), h(NyVersjon, { open: true, stack: false, onUpdate: none, onLater: none })),
    h('div', null, h('p', { className: 'lbl' }, 'Med en linje, uten «Senere»'), h(NyVersjon, { open: true, stack: false, onUpdate: none, description: 'Oppdater når det passer deg. Alt du har lagret, blir med.' })),
    h('div', null, h('p', { className: 'lbl' }, 'Venter på en lagring'), h(NyVersjon, { open: true, stack: false, updating: true, onUpdate: none, onLater: none, description: 'Oppdaterer så snart det du holder på med, er lagret.' })),
    h('div', { lang: 'en' }, h('p', { className: 'lbl' }, 'English'), h(NyVersjon, { open: true, stack: false, onUpdate: none, onLater: none, title: 'New version', updateLabel: 'Update', laterLabel: 'Later' })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
