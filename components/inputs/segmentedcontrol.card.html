<!-- @dsCard group="Components" viewport="700x360" name="SegmentedControl" subtitle="Two to five exclusive options in a row" -->
<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SegmentedControl</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../dist/sussi.global.js"></script>
<style>body{padding:20px 24px;background:var(--bg)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 32px;max-width:640px}.col{display:grid;gap:16px;align-content:start}.lbl{font:var(--type-meta);color:var(--fg-3)}@media (max-width:520px){.grid{grid-template-columns:1fr}}</style>
</head><body><div id="root"></div>
<script>
// ?theme=dark. Plain React.createElement, so the card needs no Babel.
const { SegmentedControl } = window.SussiDesignSystem_a2c9b8;
const h = React.createElement;
if (new URLSearchParams(location.search).get('theme')) document.documentElement.dataset.theme = 'dark';
function App() {
  const [unit, setUnit] = React.useState('g');
  return h('div', { className: 'grid' },
    h('div', { className: 'col' },
      h('span', { className: 'lbl' }, 'tre alternativer · legend og hint'),
      h(SegmentedControl, { label: 'Hvor står planten?', hint: 'Kan endres senere.', options: ['Ute', 'Inne', 'Drivhus'], defaultValue: 'Ute' }),
      h('span', { className: 'lbl' }, 'med ikoner'),
      h(SegmentedControl, { label: 'Sådd', options: [{ value: 'var', label: 'Vår', icon: 'sprout' }, { value: 'sommer', label: 'Sommer', icon: 'sun' }, { value: 'host', label: 'Høst', icon: 'leaf' }], defaultValue: 'var' })),
    h('div', { className: 'col' },
      h('span', { className: 'lbl' }, 'styrt · fullWidth'),
      h(SegmentedControl, { label: 'Enhet', options: [{ value: 'g', label: 'Gram' }, { value: 'dl', label: 'Desiliter' }, { value: 'stk', label: 'Stykk' }], value: unit, onChange: setUnit, fullWidth: true }),
      h('span', { className: 'lbl' }, 'slått av · disabled på gruppa'),
      h(SegmentedControl, { label: 'Porsjoner', hint: 'Settes når oppskriften er lagret.', options: ['2', '4', '6'], defaultValue: '4', disabled: true })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
