# Deploys the documentation site in side/ to GitHub Pages (https://mariisno.github.io/sussi-ui/).
# side/ is built before it is committed, so there is no build step: the workflow uploads the folder
# as it is. A branch can only serve the repo root or /docs, hence the workflow.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run that is already deploying is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: side
      - id: deployment
        uses: actions/deploy-pages@v4
