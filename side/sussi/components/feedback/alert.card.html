<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alert</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{padding:20px 24px;background:var(--bg)}.col{display:grid;gap:12px;max-width:560px}.lbl{font:var(--type-meta);color:var(--fg-3)}.card{padding:16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-card);display:grid;gap:12px}</style>
</head><body><div id="root"></div>
<script>
// ?theme=dark. Plain React.createElement, so the card needs no Babel.
const { Alert, Button } = window.SussiDesignSystem_a2c9b8;
const h = React.createElement;
if (new URLSearchParams(location.search).get('theme')) document.documentElement.dataset.theme = 'dark';
function App() {
  const [offline, setOffline] = React.useState(true);
  return h('div', { className: 'col' },
    h('span', { className: 'lbl' }, 'fire toner · ikon og farge' ),
    h(Alert, null, 'Endringer lagres etter hvert.'),
    h(Alert, { tone: 'success', title: 'Lagret' }, 'Oppskriften er lagret og ligger under Mine oppskrifter.'),

    h('div', { className: 'card' },
      h(Alert, { tone: 'info', title: 'Ny versjon av hagedagboka', actions: h(Button, { size: 'sm', variant: 'secondary' }, 'Se hva som er nytt') }, 'Oppdateringen hentes neste gang du åpner appen.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
