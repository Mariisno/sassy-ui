<!-- @dsCard group="Components" viewport="700x340" name="Skeleton" subtitle="Text lines, circle, rectangle; the region says it is loading" -->
<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skeleton</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../dist/sussi.global.js"></script>
<style>body{padding:20px 24px;background:var(--bg)}.col{display:grid;gap:14px;max-width:560px}.lbl{font:var(--type-meta);color:var(--fg-3)}.card{padding:16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-card)}.rowc{display:flex;gap:12px;align-items:flex-start}.rest{flex:1;min-width:0}.list{display:grid;gap:10px}</style>
</head><body><div id="root"></div>
<script>
// ?theme=dark. Plain React.createElement, so the card needs no Babel. The pattern: aria-busy on the region
// plus one status text; every Skeleton is aria-hidden.
const { Skeleton, Spinner } = window.SussiDesignSystem_a2c9b8;
const h = React.createElement;
if (new URLSearchParams(location.search).get('theme')) document.documentElement.dataset.theme = 'dark';
const row = (key) => h('div', { className: 'rowc', key }, h(Skeleton, { variant: 'circle', size: 40 }), h('div', { className: 'rest' }, h(Skeleton, { lines: 2 })));
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' },
  h('span', { className: 'lbl' }, 'et kort som laster · aria-busy på kortet, én statustekst'),
  h('section', { className: 'card', 'aria-busy': 'true', 'aria-label': 'Oppskrift' },
    h(Spinner, { size: 'sm', label: 'Laster oppskriften', style: { float: 'right' } }),
    h(Skeleton, { variant: 'rect', height: 120, style: { marginBottom: 12 } }),
    h(Skeleton, { width: '55%', style: { height: '1.2em' } }),
    h(Skeleton, { lines: 3 })),
  h('span', { className: 'lbl' }, 'en liste · sirkel og to linjer per rad'),
  h('section', { className: 'list', 'aria-busy': 'true' },
    h('span', { className: 's-sr-only', role: 'status' }, 'Laster oppskrifter'),
    ['a', 'b', 'c'].map(row))));
</script></body></html>
