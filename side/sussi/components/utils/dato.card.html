<!-- @dsCard group="Components" viewport="700x360" name="Dato" subtitle="formatDato, formatRelativ, formatTid, formatTidsrom in nb and en" -->
<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dato</title><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px 24px;background:var(--bg)}.col{display:grid;gap:16px;max-width:560px}.lbl{font:var(--type-meta);color:var(--fg-3)}table{border-collapse:collapse;width:100%;font:var(--type-body-sm);color:var(--fg-1)}th{text-align:left;font:var(--type-label);color:var(--fg-2);padding:6px 10px 6px 0;border-bottom:1px solid var(--border)}td{padding:6px 10px 6px 0;border-bottom:1px solid var(--border);vertical-align:top}td:first-child{font:var(--type-code);color:var(--fg-2);white-space:nowrap}caption{text-align:left;font:var(--type-meta);color:var(--fg-3);padding:0 0 6px}</style>
</head><body><div id="root"></div>
<script type="module">
// ?theme=dark. The helper is plain ES, no React: the card imports it straight from the source.
import { formatDato, formatRelativ, formatTid, formatDatoTid, formatTidsrom, tilIsoDato } from './dato.js';
if (new URLSearchParams(location.search).get('theme')) document.documentElement.dataset.theme = 'dark';
const naa = new Date(2026, 9, 30, 12); // a fixed «now», so the card reads the same every day
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const rows = [
  ["formatDato('2026-10-30')", formatDato('2026-10-30'), formatDato('2026-10-30', { lang: 'en' })],
  ["formatDato(d, { stil: 'lang' })", formatDato('2026-10-30', { stil: 'lang' }), formatDato('2026-10-30', { stil: 'lang', lang: 'en' })],
  ["formatDato(d, { aar: 'auto' })", formatDato('2026-10-30', { aar: 'auto', naa }), formatDato('2026-10-30', { aar: 'auto', naa, lang: 'en' })],
  ["formatRelativ('2026-10-30')", formatRelativ('2026-10-30', { naa }), formatRelativ('2026-10-30', { naa, lang: 'en' })],
  ["formatRelativ('2026-10-29')", formatRelativ('2026-10-29', { naa }), formatRelativ('2026-10-29', { naa, lang: 'en' })],
  ["formatRelativ('2026-10-12')", formatRelativ('2026-10-12', { naa }), formatRelativ('2026-10-12', { naa, lang: 'en' })],
  ["formatTid('2026-10-30T14:30')", formatTid('2026-10-30T14:30'), formatTid('2026-10-30T14:30', { lang: 'en' })],
  ["formatDatoTid('2026-10-30T14:30')", formatDatoTid('2026-10-30T14:30'), formatDatoTid('2026-10-30T14:30', { lang: 'en' })],
  ["formatTidsrom(fra, til)", formatTidsrom('2026-10-30T14:30', '2026-10-30T15:15'), formatTidsrom('2026-10-30T14:30', '2026-10-30T15:15', { lang: 'en' })],
  ["formatTidsrom(fra, til, { dato: true })", formatTidsrom('2026-10-30T14:30', '2026-10-30T15:15', { dato: true }), formatTidsrom('2026-10-30T14:30', '2026-10-30T15:15', { dato: true, lang: 'en' })],
  ["formatTidsrom(kveld, morgen)", formatTidsrom('2026-10-30T22:00', '2026-10-31T06:00'), formatTidsrom('2026-10-30T22:00', '2026-10-31T06:00', { lang: 'en' })],
  ["tilIsoDato(new Date(2026, 9, 30))", tilIsoDato(new Date(2026, 9, 30)), tilIsoDato(new Date(2026, 9, 30))],
];
document.getElementById('root').innerHTML = `<div class="col"><span class="lbl">«nå» er 30. oktober 2026 i kortet · nb-NO og en-GB fra Intl, så det er nettleserens månedsnavn</span>
<table><caption>Hagedagboka: det samme i begge språk</caption><thead><tr><th scope="col">Kall</th><th scope="col">nb</th><th scope="col">en</th></tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
</script></body></html>
