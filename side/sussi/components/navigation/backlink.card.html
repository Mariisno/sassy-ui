</head><body><div id="root"></div>
<script>
// ?theme=dark. Plain React.createElement, so the card needs no Babel.
const { BackLink } = window.SussiDesignSystem_a2c9b8;
const h = React.createElement;
if (new URLSearchParams(location.search).get('theme')) document.documentElement.dataset.theme = 'dark';
// Stands in for React Router's Link: takes `to`, renders an <a>.
const RouterLink = React.forwardRef(function RouterLink({ to, children, ...rest }, ref) { return h('a', { ref, href: to, ...rest }, children); });
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' },
  h('span', { className: 'lbl' }, 'standard «Tilbake» · med stedet · as={RouterLink} to · engelsk'),
  h('div', { className: 'row' },
    h(BackLink, { href: '#planter' }),
    h(BackLink, { href: '#planter' }, 'Tilbake til planter'),
    h(BackLink, { as: RouterLink, to: '#uke' }, 'Tilbake til uka'),
    h(BackLink, { href: '#plants' }, 'Back')),
  h('span', { className: 'lbl' }, 'øverst på en side som ble åpnet fra en liste · på --surface-1'),
  h('div', { className: 'page' },
    h(BackLink, { href: '#planter' }, 'Tilbake til planter'),
    h('h2', null, 'Tomat ‘Gardener’s Delight’'),
    h('p', null, 'Sådd 14. mars, plantet ut 2. juni. Første høst 30. juli.'))));
</script></body></html>
