<!-- @dsCard group="Brand" viewport="700x200" name="Light & dark" subtitle="Equal citizens — same aliases, re-mapped" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Light &amp; dark</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:var(--type-meta);color:var(--fg-3)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div data-theme="light" style="background:var(--bg);color:var(--fg-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="m">light</span><span style="height:22px;padding:0 8px;border-radius:999px;background:var(--success-soft);color:var(--success-fg);font:500 12px/22px var(--font-sans)">● Live</span></div><div style="background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px"><div style="font:var(--type-h3)">Garden log</div><div style="font:var(--type-body-sm);color:var(--fg-2)">12 of 30 tasks done</div><div style="margin-top:8px;height:6px;border-radius:3px;background:var(--surface-3)"><div style="width:40%;height:100%;border-radius:3px;background:var(--accent)"></div></div></div></div><div data-theme="dark" style="background:var(--bg);color:var(--fg-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="m">dark</span><span style="height:22px;padding:0 8px;border-radius:999px;background:var(--success-soft);color:var(--success-fg);font:500 12px/22px var(--font-sans)">● Live</span></div><div style="background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px"><div style="font:var(--type-h3)">Garden log</div><div style="font:var(--type-body-sm);color:var(--fg-2)">12 of 30 tasks done</div><div style="margin-top:8px;height:6px;border-radius:3px;background:var(--surface-3)"><div style="width:40%;height:100%;border-radius:3px;background:var(--accent)"></div></div></div></div></div>
</body></html>
