<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Voice</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:var(--type-meta);color:var(--fg-3)}</style></head><body>

cent-soft-fg);opacity:.8;margin-bottom:4px">do</div>Task archived · Undo</div><div style="padding:12px 14px;border-radius:var(--radius-md);background:var(--surface-2);color:var(--fg-3);font:var(--type-body-sm)"><div class="m" style="margin-bottom:4px">don’t</div><s style="text-decoration-color:var(--brick-300)">Are you sure you want to archive this task?</s></div></div></div>
