<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="--success / --warning / --danger / --info — solid, soft, fg" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Semantic status</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:var(--type-meta);color:var(--fg-3)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:8px;background:var(--success)"></div><div style="height:40px;border-radius:8px;background:var(--success-soft);color:var(--success-fg);display:flex;align-items:center;padding:0 12px;font:var(--type-label)">Saved</div><div class="m">--success</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:8px;background:var(--warning)"></div><div style="height:40px;border-radius:8px;background:var(--warning-soft);color:var(--warning-fg);display:flex;align-items:center;padding:0 12px;font:var(--type-label)">Offline</div><div class="m">--warning</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:8px;background:var(--danger)"></div><div style="height:40px;border-radius:8px;background:var(--danger-soft);color:var(--danger-fg);display:flex;align-items:center;padding:0 12px;font:var(--type-label)">Blocked</div><div class="m">--danger</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:8px;background:var(--info)"></div><div style="height:40px;border-radius:8px;background:var(--info-soft);color:var(--info-fg);display:flex;align-items:center;padding:0 12px;font:var(--type-label)">Syncing</div><div class="m">--info</div></div></div>
</body></html>
