<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alert</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../dist/sassy.global.js"></script>
<style>body{padding:20px 24px;background:var(--bg)}.col{display:grid;gap:12px;max-width:560px}.lbl{font:var(--type-meta);color:var(--fg-3)}.card{padding:16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-card);display:grid;gap:12px}</style>
</head><body><div id="root"></div>
<script>
// ?theme=dark. Plain React.createElement, so the card needs no Babel.
const { Alert, Button } = window.SassyDesignSystem_a2c9b8;
const h = React.createElement;
if (new URLSearchParams(location.search).get('theme')) document.documentElement.dataset.theme = 'dark';
// The card follows the page that embeds it (same origin), like the Dialog card: the Norwegian docs get a Norwegian card,
// the English docs an English one. Opened on its own, or where the page cannot be read, it keeps the language on its <html>.
const nb = (() => { try { const p = window.frameElement && window.frameElement.ownerDocument.documentElement.lang; return p ? p === 'nb' : document.documentElement.lang === 'nb'; } catch (e) { return document.documentElement.lang === 'nb'; } })();
document.documentElement.lang = nb ? 'nb' : 'en';
const T = nb
  ? { toner: 'fire toner · ikon og farge', info: 'Endringer lagres etter hvert.', lagret: 'Lagret', lagretTekst: 'Oppskriften er lagret og ligger under Mine oppskrifter.', frakoblet: 'Du er frakoblet. Endringene synkes når du er tilbake.', lukk: 'Lukk', igjen: 'Vis advarselen igjen', feil: 'Kunne ikke lagre', provIgjen: 'Prøv igjen', feilTekst: 'Nettet forsvant underveis. Ingenting gikk tapt.', iKort: 'i et kort · med egne handlinger', ny: 'Ny versjon av hagedagboka', nytt: 'Se hva som er nytt', nyTekst: 'Oppdateringen hentes neste gang du åpner appen.' }
  : { toner: 'four tones · icon and colour', info: 'Changes save as you go.', lagret: 'Saved', lagretTekst: 'The recipe is saved and is in My recipes.', frakoblet: "You're offline. Changes sync when you're back.", lukk: 'Dismiss', igjen: 'Show the warning again', feil: "Couldn't save", provIgjen: 'Try again', feilTekst: 'The connection dropped on the way. Nothing was lost.', iKort: 'in a card · with its own actions', ny: 'New version of the garden diary', nytt: "See what's new", nyTekst: 'The update arrives the next time you open the app.' };
function App() {
  const [offline, setOffline] = React.useState(true);
  return h('div', { className: 'col' },
    h('span', { className: 'lbl' }, T.toner),
    h(Alert, null, T.info),
    h(Alert, { tone: 'success', title: T.lagret }, T.lagretTekst),
    offline ? h(Alert, { tone: 'warning', onClose: () => setOffline(false), closeLabel: T.lukk }, T.frakoblet) : h(Button, { variant: 'secondary', size: 'sm', onClick: () => setOffline(true) }, T.igjen),
    h(Alert, { tone: 'danger', title: T.feil, actionLabel: T.provIgjen, onAction: () => {} }, T.feilTekst),
    h('span', { className: 'lbl' }, T.iKort),
    h('div', { className: 'card' },
      h(Alert, { tone: 'info', title: T.ny, actions: h(Button, { size: 'sm', variant: 'secondary' }, T.nytt) }, T.nyTekst)));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
