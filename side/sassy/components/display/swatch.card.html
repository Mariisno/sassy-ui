<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swatch og ScrollRow</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{padding:20px 24px;background:var(--bg)}.col{display:grid;gap:8px;max-width:560px}.row{display:flex;flex-wrap:wrap;gap:2px;align-items:center}.narrow{max-width:240px}.lbl{font:var(--type-meta);color:var(--fg-3);margin-top:8px}</style>
</head><body><div id="root"></div>
<script>
// ?theme=dark. Plain React.createElement, so the card needs no Babel.
const { Swatch, ScrollRow, Tag } = window.SassyDesignSystem_a2c9b8;
const h = React.createElement;
if (new URLSearchParams(location.search).get('theme')) document.documentElement.dataset.theme = 'dark';
const farger = [['#FFFFFF', 'Hvit'], ['#1F1D1B', 'Svart'], ['#1F3A5F', 'Marineblå'], ['#B58AA0', 'Lyng'], ['#C0714F', 'Leire'], ['#AEBE5A', 'Lav'], ['#E2C17B', 'Oker'], ['#9DB8CB', 'Fjord']];
function Velger() {
  const [valgt, setValgt] = React.useState('Lyng');
  return h('div', { role: 'group', 'aria-label': 'Farge', className: 'row' }, farger.map(([c, n]) => h(Swatch, { key: n, color: c, label: n, pressed: valgt === n, onClick: () => setValgt(n) })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'col' },
  h('span', { className: 'lbl' }, 'vanlige prikker · sm, md, lg'),
  h('div', { className: 'row', style: { gap: 10 } }, h(Swatch, { color: '#1F3A5F', size: 'sm' }), h(Swatch, { color: '#1F3A5F', label: 'Marineblå' }), h(Swatch, { color: '#1F3A5F', size: 'lg' }), h(Swatch, { color: '#FFFFFF', label: 'Hvit' }), h(Swatch, { color: '#1F1D1B', label: 'Svart' })),
  h('span', { className: 'lbl' }, 'onClick + pressed · fargevelger'),
  h(Velger),
  h('span', { className: 'lbl' }, 'ScrollRow · ruller sideveis og fader i kanten'),
  h('div', { className: 'narrow' }, h(ScrollRow, null, ['Alle', 'Gensere', 'Bukser', 'Kjoler', 'Jakker', 'Sko'].map((t, i) => h(Tag, { key: t, selected: i === 0 }, t))))));
</script></body></html>
