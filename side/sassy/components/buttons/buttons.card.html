<!-- @dsCard group="Components" viewport="700x300" name="Buttons" subtitle="Button + IconButton — variants, sizes, states" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../dist/sassy.global.js"></script>
<style>body{padding:20px 24px;background:var(--bg)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-meta);color:var(--fg-3);width:78px;flex:none}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const S = window.SassyDesignSystem_a2c9b8;
const { Button, IconButton } = S;
// The card follows the page that embeds it (same origin), like the Dialog card: the Norwegian docs get a Norwegian card,
// the English docs an English one. Opened on its own, or where the page cannot be read, it keeps the language on its <html>.
const nb = (() => { try { const p = window.frameElement && window.frameElement.ownerDocument.documentElement.lang; return p ? p === 'nb' : document.documentElement.lang === 'nb'; } catch (e) { return document.documentElement.lang === 'nb'; } })();
document.documentElement.lang = nb ? 'nb' : 'en';
const T = nb
  ? { variants: 'varianter', save: 'Lagre endringer', cancel: 'Avbryt', newTask: 'Ny oppgave', skip: 'Hopp over', del: 'Slett', sizes: 'størrelser', sm: 'Liten', md: 'Middels', lg: 'Stor', states: 'tilstander', saving: 'Lagrer', disabled: 'Slått av', ikonRad: 'ikon', more: 'Mer', add: 'Legg til', search: 'Søk', open: 'Åpne', settings: 'Innstillinger' }
  : { variants: 'variants', save: 'Save changes', cancel: 'Cancel', newTask: 'New task', skip: 'Skip', del: 'Delete', sizes: 'sizes', sm: 'Small', md: 'Medium', lg: 'Large', states: 'states', saving: 'Saving', disabled: 'Disabled', ikonRad: 'icon', more: 'More', add: 'Add', search: 'Search', open: 'Open', settings: 'Settings' };
function App(){return (<div className="col">
<div className="row"><span className="lbl">{T.variants}</span><Button>{T.save}</Button><Button variant="secondary">{T.cancel}</Button><Button variant="soft" iconLeft="plus">{T.newTask}</Button><Button variant="ghost">{T.skip}</Button><Button variant="danger" iconLeft="trash-2">{T.del}</Button></div>
<div className="row"><span className="lbl">{T.sizes}</span><Button size="sm">{T.sm}</Button><Button>{T.md}</Button><Button size="lg" iconRight="arrow-right">{T.lg}</Button></div>
<div className="row"><span className="lbl">{T.states}</span><Button loading>{T.saving}</Button><Button disabled>{T.disabled}</Button><Button variant="secondary" disabled>{T.disabled}</Button></div>
<div className="row"><span className="lbl">{T.ikonRad}</span><IconButton icon="ellipsis" label={T.more} /><IconButton icon="plus" label={T.add} variant="secondary" /><IconButton icon="search" label={T.search} variant="secondary" size="sm" /><IconButton icon="arrow-up-right" label={T.open} variant="primary" round /><IconButton icon="settings" label={T.settings} size="lg" /></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
