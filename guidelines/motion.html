<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="Calm ease-out · 120 / 200 / 320ms · no bounce" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:var(--type-meta);color:var(--fg-3)}@keyframes slide{to{transform:translateX(150%)}}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div style="padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-1)"><div style="font:var(--type-label)">--ease-calm</div><div class="m" style="margin-top:4px">cubic-bezier(.2,.7,.2,1)</div><div style="font:var(--type-body-sm);color:var(--fg-2);margin-top:8px">default — enters, hovers</div><div style="margin-top:12px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden"><div class="bar" style="height:100%;width:40%;background:var(--accent);border-radius:2px;animation:slide 1.6s var(--ease-calm) infinite alternate"></div></div></div><div style="padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-1)"><div style="font:var(--type-label)">--ease-in-out</div><div class="m" style="margin-top:4px">cubic-bezier(.45,0,.25,1)</div><div style="font:var(--type-body-sm);color:var(--fg-2);margin-top:8px">moving between states</div><div style="margin-top:12px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden"><div class="bar" style="height:100%;width:40%;background:var(--accent);border-radius:2px;animation:slide 1.6s var(--ease-in-out) infinite alternate"></div></div></div><div style="padding:14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-1)"><div style="font:var(--type-label)">--ease-exit</div><div class="m" style="margin-top:4px">cubic-bezier(.4,0,1,1)</div><div style="font:var(--type-body-sm);color:var(--fg-2);margin-top:8px">leaving the screen</div><div style="margin-top:12px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden"><div class="bar" style="height:100%;width:40%;background:var(--accent);border-radius:2px;animation:slide 1.6s var(--ease-exit) infinite alternate"></div></div></div></div><div class="m" style="margin-top:12px">fast 120ms — hover, press · base 200ms — toggles, tabs · slow 320ms — dialogs, toasts · reduced-motion → 0</div>
</body></html>
